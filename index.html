<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chris Oliveira</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    background: #d8d6d3;
    overflow: hidden;
  }

  /* JS sets --vh to exact window.innerHeight so nothing bleeds under the toolbar */
  body {
    height: 100vh;
    height: calc(var(--vh, 1vh) * 100);
    position: relative;
  }

  .photo {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 65% 32%;
    filter: grayscale(100%);
    z-index: 0;
  }

  /* On mobile portrait, zoom in so Chris fills the frame more */
  @media (max-width: 600px) {
    .photo {
      transform: scale(1.3);
      transform-origin: 55% 50%;
    }
  }

  .ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    font-family: 'Jost', sans-serif;
    color: #fff;
  }

  .top-left {
    position: absolute;
    top: calc(5.5% + env(safe-area-inset-top, 0px));
    left: calc(5% + env(safe-area-inset-left, 0px));
    font-size: clamp(9px, .85vw, 13px);
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .top-right {
    position: absolute;
    top: calc(5.5% + env(safe-area-inset-top, 0px));
    right: calc(5% + env(safe-area-inset-right, 0px));
    font-size: clamp(9px, .85vw, 13px);
    font-weight: 300;
    line-height: 1.7;
    letter-spacing: 0.12em;
    text-align: right;
    text-transform: uppercase;
  }

  .name-block {
    position: absolute;
    bottom: calc(6% + env(safe-area-inset-bottom, 0px));
    left: calc(4% + env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(14px, 1.6vh, 26px);
  }

  .contact-btn {
    display: inline-flex;
    align-items: center;
    padding: clamp(9px, .75vw, 13px) clamp(20px, 2vw, 32px);
    border: 1px solid rgba(255,255,255,0.65);
    border-radius: 999px;
    font-family: 'Jost', sans-serif;
    font-size: clamp(9px, .8vw, 13px);
    font-weight: 300;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    background: rgba(255,255,255,0.1);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background .25s, border-color .25s;
    white-space: nowrap;
  }

  .contact-btn:hover {
    background: rgba(255,255,255,0.2);
    border-color: #fff;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: clamp(52px, 18vw, 320px);
    line-height: 0.85;
    letter-spacing: -0.01em;
  }

  .year {
    position: absolute;
    bottom: calc(6% + env(safe-area-inset-bottom, 0px));
    right: calc(5% + env(safe-area-inset-right, 0px));
    font-size: clamp(9px, .85vw, 13px);
    font-weight: 300;
    letter-spacing: 0.12em;
  }
</style>
</head>
<body>
  <img class="photo" src="IMG_3319.jpeg" alt="Chris Oliveira">
  <div class="ui">
    <div class="top-left">Boca Raton, Florida</div>
    <div class="top-right">Digital Design<br>Website Development</div>
    <div class="name-block">
      <a class="contact-btn" href="mailto:chris@chrisoliveira.co">Get in touch</a>
      <div class="name">Chris<br>Oliveira</div>
    </div>
    <div class="year">2025</div>
  </div>

  <script>
    // Set --vh to the real visible height once on load.
    // Using window.innerHeight captures the exact viewport Safari gives us,
    // excluding the toolbar — so body fills only the visible area, no gaps.
    function setVh() {
      document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    setVh();
    // Re-run on orientation change (delayed so Safari finishes animating)
    window.addEventListener('orientationchange', function() { setTimeout(setVh, 300); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brake Kingdom | Hallandale Auto Repair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #F5F5F0; }

    nav {
      height: 68px;
      background: #1C1C1E;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      position: relative;
      z-index: 10;
    }
    .nav-brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: #F5F5F0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .nav-brand span { color: #F9A825; }
    .nav-phone {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #F5F5F0;
      text-decoration: none;
    }

    .hero {
      position: relative;
      height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        155deg,
        rgba(28, 28, 30, 0.94) 0%,
        rgba(28, 28, 30, 0.68) 50%,
        rgba(28, 28, 30, 0.92) 100%
      );
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 700px;
      padding: 0 24px;
    }
    .hero-content h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(36px, 5.5vw, 66px);
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.08;
      margin-bottom: 16px;
    }
    .hero-content p {
      font-size: clamp(16px, 2vw, 19px);
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .cta-btn {
      display: inline-block;
      background: #C62828;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 16px 48px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .cta-btn:hover { background: #a12020; }

    .trust-bar {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .trust-bar span {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 14px;
      color: #F9A825;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .trust-bar .divider {
      width: 1px;
      height: 16px;
      background: rgba(249, 168, 37, 0.35);
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">Brake <span>Kingdom</span></div>
    <a href="tel:3059332882" class="nav-phone">(305) 933-2882</a>
  </nav>
  <section class="hero">
    <img src="../../assets/samples/Auto repair/Boss-Auto-Repair-in-Olympia-Four-Wheel-Drive-Repair.jpg" alt="Auto repair shop">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Hallandale's Full-Service Auto Repair</h1>
      <p>Owner-operated expertise for every make and model. Honest work, fair prices.</p>
      <a href="#" class="cta-btn">Schedule Service</a>
    </div>
    <div class="trust-bar">
      <span>ASE Certified</span>
      <div class="divider"></div>
      <span>Owner Operated</span>
      <div class="divider"></div>
      <span>Since 1995</span>
      <div class="divider"></div>
      <span>Hallandale, FL</span>
    </div>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>European Auto Repair Center | Boca Raton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8f9fa; }

    nav {
      height: 68px;
      background: #1a1f2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      position: relative;
      z-index: 10;
    }
    .nav-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: 26px;
      color: #f8f9fa;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .nav-brand span { color: #c9a84c; }
    .nav-phone {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #c0c6cf;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .hero {
      position: relative;
      height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        130deg,
        rgba(26, 31, 46, 0.95) 0%,
        rgba(26, 31, 46, 0.78) 50%,
        rgba(26, 31, 46, 0.92) 100%
      );
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 760px;
      padding: 0 24px;
    }
    .hero-content h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: clamp(40px, 6vw, 72px);
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.05;
      margin-bottom: 16px;
      letter-spacing: 0.03em;
    }
    .hero-content p {
      font-size: clamp(16px, 2vw, 20px);
      color: #c0c6cf;
      line-height: 1.5;
      margin-bottom: 36px;
    }
    .cta-btn {
      display: inline-block;
      background: #c0392b;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 52px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .cta-btn:hover { background: #a93226; }

    .trust-bar {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .trust-bar span {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400;
      font-size: 15px;
      color: #c9a84c;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      white-space: nowrap;
    }
    .trust-bar .divider {
      width: 1px;
      height: 16px;
      background: rgba(201, 168, 76, 0.30);
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">European Auto <span>Repair Center</span></div>
    <a href="tel:5613673455" class="nav-phone">(561) 367-3455</a>
  </nav>
  <section class="hero">
    <img src="../../assets/samples/Auto repair/auto-mechanic-looking-under-hood-of-car.jpg" alt="Mechanic working under hood">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Boca Raton's European Auto Specialists</h1>
      <p>Dealer-level expertise for Mercedes, BMW, Audi, and Porsche -- without the dealer price tag.</p>
      <a href="#" class="cta-btn">Schedule Service</a>
    </div>
    <div class="trust-bar">
      <span>ASE Certified</span>
      <div class="divider"></div>
      <span>European Specialists</span>
      <div class="divider"></div>
      <span>Boca Raton</span>
    </div>
  </section>
</body>
</html>

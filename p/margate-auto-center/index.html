<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Margate Auto Center | Full-Service Auto Repair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8f9fa; }

    nav {
      height: 68px;
      background: #1b2a4a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      position: relative;
      z-index: 10;
    }
    .nav-brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #f8f9fa;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .nav-brand span { color: #d4a017; }
    .nav-phone {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #f8f9fa;
      text-decoration: none;
    }

    .hero {
      position: relative;
      height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(27, 42, 74, 0.93) 0%,
        rgba(27, 42, 74, 0.75) 50%,
        rgba(27, 42, 74, 0.88) 100%
      );
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 720px;
      padding: 0 24px;
    }
    .hero-content h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(36px, 5.5vw, 64px);
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .hero-content p {
      font-size: clamp(16px, 2vw, 19px);
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .cta-btn {
      display: inline-block;
      background: #cc2936;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 16px 48px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .cta-btn:hover { background: #a82230; }

    .trust-bar {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .trust-bar span {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 14px;
      color: #d4a017;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .trust-bar .divider {
      width: 1px;
      height: 16px;
      background: rgba(212, 160, 23, 0.35);
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">Margate <span>Auto Center</span></div>
    <a href="tel:9549798418" class="nav-phone">(954) 979-8418</a>
  </nav>
  <section class="hero">
    <img src="../../assets/samples/Auto repair/auto-mechanic-looking-under-hood-of-car.jpg" alt="Mechanic working under hood">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Margate's Complete Auto Care</h1>
      <p>Full-service repairs and maintenance from certified technicians who do it right.</p>
      <a href="#" class="cta-btn">Schedule Service</a>
    </div>
    <div class="trust-bar">
      <span>Certified Technicians</span>
      <div class="divider"></div>
      <span>All Makes &amp; Models</span>
      <div class="divider"></div>
      <span>Margate, FL</span>
    </div>
  </section>
</body>
</html>

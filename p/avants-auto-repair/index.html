<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avant's Automotive Repair | Deerfield Beach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Source Sans 3', sans-serif; background: #ffffff; }

    nav {
      height: 68px;
      background: #1a2744;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      position: relative;
      z-index: 10;
    }
    .nav-brand {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .nav-brand span { color: #d4a843; }
    .nav-phone {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #ffffff;
      text-decoration: none;
    }

    .hero {
      position: relative;
      height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        140deg,
        rgba(26, 39, 68, 0.94) 0%,
        rgba(26, 39, 68, 0.76) 55%,
        rgba(26, 39, 68, 0.90) 100%
      );
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 740px;
      padding: 0 24px;
    }
    .hero-content h1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: clamp(36px, 5.5vw, 64px);
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .hero-content p {
      font-size: clamp(16px, 2vw, 20px);
      color: rgba(255, 255, 255, 0.84);
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .cta-btn {
      display: inline-block;
      background: #c0392b;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 16px 48px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .cta-btn:hover { background: #a93226; }

    .trust-bar {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .trust-bar span {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 14px;
      color: #d4a843;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .trust-bar .divider {
      width: 1px;
      height: 16px;
      background: rgba(212, 168, 67, 0.35);
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">Avant's <span>Automotive</span></div>
    <a href="tel:9544806056" class="nav-phone">(954) 480-6056</a>
  </nav>
  <section class="hero">
    <img src="../../assets/samples/Auto repair/auto-mechanic-looking-under-hood-of-car.jpg" alt="Mechanic working under hood">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Deerfield Beach's Honest Auto Repair</h1>
      <p>Three generations of trust. ASE-certified service your family can depend on.</p>
      <a href="#" class="cta-btn">Schedule Service</a>
    </div>
    <div class="trust-bar">
      <span>ASE Certified</span>
      <div class="divider"></div>
      <span>AAA Authorized</span>
      <div class="divider"></div>
      <span>Since 1988</span>
      <div class="divider"></div>
      <span>Deerfield Beach</span>
    </div>
  </section>
</body>
</html>
